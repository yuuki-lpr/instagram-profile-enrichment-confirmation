name: Deploy fixture confirmation page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static allowlist
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test "$(find site -type f | sort)" = "site/index.html"
          ! grep -nE 'AIza|gho_|client_secret|access_token|spreadsheets/d/|instagram\.com/' site/index.html
          ! grep -nE '<script|<form|fetch\(|localStorage|sessionStorage|serviceWorker' site/index.html
          grep -q 'fixture確認ページ' site/index.html
          grep -q 'v0.1.30' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
